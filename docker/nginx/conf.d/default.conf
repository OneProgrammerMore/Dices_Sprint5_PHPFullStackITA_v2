server {
    listen 80;
    server_name localhost;
	
	# Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # set $CSP "default-src 'self' ";
    # set $CSP "${CSP}; script-src 'self'";
    # set $CSP "${CSP}; script-src-elem 'self' ";
    # set $CSP "${CSP}; style-src 'self'  ";
    # set $CSP "${CSP}; style-src-elem 'self' ";
    # set $CSP "${CSP}; frame-src 'self' ";
    # set $CSP "${CSP}; frame-ancestors 'self' ";
    # set $CSP "${CSP}; img-src 'self' ";
    # set $CSP "${CSP}; connect-src 'self' ";
    # set $CSP "${CSP}; font-src 'self' ";

    # add_header Content-Security-Policy $CSP  always;


    location /api/documentation {
        set $CSP "default-src 'self' ";
        set $CSP "${CSP}; script-src 'self'";
        set $CSP "${CSP}; script-src-elem 'self' 'unsafe-inline' ";
        set $CSP "${CSP}; style-src 'self' ";
        set $CSP "${CSP}; style-src-elem 'self' 'unsafe-inline'";
        set $CSP "${CSP}; frame-src 'self' ";
        set $CSP "${CSP}; frame-ancestors 'self' ";
        set $CSP "${CSP}; img-src 'self' ";
        set $CSP "${CSP}; connect-src 'self' ";
        set $CSP "${CSP}; font-src 'self' ";

        add_header Content-Security-Policy $CSP  always;


        try_files $uri $uri/ /index.php?$query_string;
    }

    charset utf-8;
    root /var/www/html/backend/public;
    index index.php index.html index.htm;

    
    location ~ /(api|docs) {

        set $CSP "default-src 'self' ";
        set $CSP "${CSP}; script-src 'self'";
        set $CSP "${CSP}; script-src-elem 'self' ";
        set $CSP "${CSP}; style-src 'self' ";
        set $CSP "${CSP}; style-src-elem 'self' 'unsafe-inline' ";
        set $CSP "${CSP}; frame-src 'self' ";
        set $CSP "${CSP}; frame-ancestors 'self' ";
        set $CSP "${CSP}; img-src 'self' ";
        set $CSP "${CSP}; connect-src 'self' ";
        set $CSP "${CSP}; font-src 'self' ";

        add_header Content-Security-Policy $CSP  always;

        try_files $uri $uri/ /index.php?$query_string;
   
    }

    
    location ~ \.php$ {
        resolver 127.0.0.11;
        set $backendPhp "dice-laravel:9000";

        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $backendPhp;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
 
    error_page 404 /index.php;
    
    location / {

        set $CSP "default-src 'self' ";
        set $CSP "${CSP}; script-src 'self'";
        set $CSP "${CSP}; script-src-elem 'self' ";
        set $CSP "${CSP}; style-src 'self' ";
        set $CSP "${CSP}; style-src-elem 'self' 'unsafe-inline'";
        set $CSP "${CSP}; frame-src 'self' ";
        set $CSP "${CSP}; frame-ancestors 'self' ";
        set $CSP "${CSP}; img-src 'self' ";
        set $CSP "${CSP}; connect-src 'self' ";
        set $CSP "${CSP}; font-src 'self' ";

        add_header Content-Security-Policy $CSP  always;

        root /var/www/html/react;
        try_files $uri $uri/ /index.html;
    }


    location ~ /\.(?!well-known).* {
        deny all;
    }
}

